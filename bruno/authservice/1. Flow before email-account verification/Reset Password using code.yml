info:
  name: Reset Password using code
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}{{port}}{{endpoint_base_users}}/password/reset"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "code": "428307",
        "password": "{{new_password}}",
        "password_confirmation": "{{new_password}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        // After the successful password reset, update the value of the `password` variable.
        if (res.status === 204) {  
          bru.setEnvVar("password", bru.getEnvVar("new_password"))
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
