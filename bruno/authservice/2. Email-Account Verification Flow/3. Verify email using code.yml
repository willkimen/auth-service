info:
  name: 3. Verify email using code
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}{{port}}{{endpoint_base_users}}/email/verify"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "code": "428307"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
