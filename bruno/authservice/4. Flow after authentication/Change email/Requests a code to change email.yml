info:
  name: Requests a code to change email
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}{{port}}{{endpoint_base_users}}/email/change/code"
  headers:
    - name: Authorization
      value: Bearer   {{access}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "new_email": "{{new_email}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
