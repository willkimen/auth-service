info:
  name: Change password using code
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}{{port}}{{endpoint_base_users}}/password/change"
  headers:
    - name: Authorization
      value: Bearer   {{access}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "code": "626564",
        "new_password": "{{new_password}}",
        "new_password_confirmation": "{{new_password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // After the password is successfully changed, update the value of the `password` variable.
        if (res.status === 204) {  
          bru.setEnvVar("password", bru.getEnvVar("new_password"))
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
