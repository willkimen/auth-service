info:
  name: Requests a code to change password
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}{{port}}{{endpoint_base_users}}/password/change/code"
  headers:
    - name: Authorization
      value: Bearer   {{access}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
