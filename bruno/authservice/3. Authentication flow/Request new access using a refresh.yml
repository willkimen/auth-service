info:
  name: Request new access using a refresh
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}{{port}}{{endpoint_base_auth}}/refresh"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "refresh": "{{refresh}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          const body = res.body
          
          bru.setEnvVar("access", body.access)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
